apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-execution-service
spec:
  replicas: 1
  template:
    metadata:
      labels:
        tags.datadoghq.com/env: "hml"
    spec:
      containers:
        - name: oficina-execution-service
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
