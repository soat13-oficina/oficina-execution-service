# ClusterIP: o acesso externo e pelo Ingress (ALB compartilhado, ADR 0008 do oficina-app);
# o OS e a Execution chegam aqui pelo DNS do cluster: http://oficina-execution-service:8080.
apiVersion: v1
kind: Service
metadata:
  name: oficina-execution-service
  labels:
    app: oficina-execution-service
spec:
  type: ClusterIP
  selector:
    app: oficina-execution-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
