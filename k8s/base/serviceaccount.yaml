# ServiceAccount do pod, associada por IRSA a uma IAM Role propria do servico
# (oficina-<env>-oficina-execution-service): tabelas DynamoDB, fila execution-commands e envio para os-saga-replies.
# A Role nasce no infra/ deste repositorio (Passo 4); o ARN real entra
# pelo patch-serviceaccount.yaml de cada overlay, preenchido pela pipeline.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oficina-execution-service
  labels:
    app: oficina-execution-service
